name: Android Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dependency / build verification
        run: ./gradlew dependencies > /dev/null

      - name: Secret scanning
        run: echo "TODO: enable repository secret scanning / gitleaks or equivalent"

      - name: Static security analysis
        run: echo "TODO: configure Android/Kotlin security tooling if required"
