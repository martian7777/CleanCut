name: Android CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile / Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Android lint
        run: ./gradlew lint

      # TODO: enable once configured.
      # - name: Detekt
      #   run: ./gradlew detekt

      # TODO: add managed-device / instrumentation tests when project supports them.
