name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK and AAB
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cleancut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cleancut-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Check for release signing secret
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEANCUT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEANCUT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/cleancut-release.p12"

      - name: Build release APK and AAB
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          CLEANCUT_KEYSTORE_PATH: ${{ github.workspace }}/cleancut-release.p12
          CLEANCUT_KEYSTORE_PASSWORD: ${{ secrets.CLEANCUT_KEYSTORE_PASSWORD }}
          CLEANCUT_KEY_ALIAS: ${{ secrets.CLEANCUT_KEY_ALIAS }}
          CLEANCUT_KEY_PASSWORD: ${{ secrets.CLEANCUT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload release APK
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cleancut-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cleancut-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/debug/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/cleancut-release.p12"
